[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-gnn-explanations"
version = "0.1.0"
description = "APEX co-designs PolyGIN and exact quadrature to produce architecture-certified Aumann-Shapley explanations for graphs."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["apex", "apex.*"]
